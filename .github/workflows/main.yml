name: Build Tatkal Sathi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project if zip exists
        run: |
          mkdir -p project
          if [ -f "TatkalSathi-Android-GitHub-Project.zip" ]; then
            unzip -q TatkalSathi-Android-GitHub-Project.zip -d project
          else
            cp -r . project/
          fi

      - name: Find and build Android app
        run: |
          cd project
          GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in project!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          chmod +x "$GRADLEW_PATH"
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tatkal-Sathi-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
